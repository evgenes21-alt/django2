{% extends "catalog/base.html" %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-sm">
                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0">
                        {% if object %}Удаление поста{% else %}Новый пост{% endif %}
                    </h4>
                </div>
                <div class="card-body">
                    <p class="card-text">Действительно хотите удалить: << {{ object.title }} ? >></p>
                    <form method="post" enctype="multipart/form-data">
                        {% csrf_token %}
                        <hr class="my-4">
                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-success">
                                Удалить
                            </button>
                            <a href="{% url 'blog:blog_list' %}" class="btn btn-secondary">Отмена</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
