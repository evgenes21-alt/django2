{% extends "catalog/base.html" %}

{% block content %}
  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-8">
        <div class="card shadow-sm">
          <div class="card-header bg-primary text-white">
            <h4 class="mb-0">
              {% if object %}Редактировать пост{% else %}Новый пост{% endif %}
            </h4>
          </div>
          <div class="card-body">
            <form method="post" enctype="multipart/form-data">
              {% csrf_token %}
              
              <!-- Рендерим поля формы красиво через Bootstrap -->
              <div class="mb-3">
                <label for="{{ form.title.id_for_label }}" class="form-label">Заголовок</label>
                {{ form.title|add_class:"form-control" }}
              </div>
              
              <div class="mb-3">
                <label for="{{ form.content.id_for_label }}" class="form-label">Текст статьи</label>
                {{ form.content|add_class:"form-control" }}
              </div>

              <div class="mb-3">
                <label class="form-label">Изображение</label>
                {% if object.image %}
                  <img src="{{ object.image.url }}" class="img-thumbnail mb-2" alt="Current image">
                {% endif %}
                {{ form.image }}
              </div>

              <div class="d-flex gap-2">
                <button type="submit" class="btn btn-success">Сохранить изменения</button>
                <a href="{% url 'blog:post_list' %}" class="btn btn-secondary">Отмена</a>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
{% endblock %}
